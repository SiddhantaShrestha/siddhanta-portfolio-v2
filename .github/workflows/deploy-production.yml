name: Deploy production Worker

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext production bundle
        env:
          NEXT_PUBLIC_SITE_URL: https://siddhantashrestha.com.np
          PRODUCTION_ALLOW_INDEXING: "true"
        run: npm run production:build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep the package wrangler; action will use it when present.
          command: deploy --config wrangler.production.jsonc
